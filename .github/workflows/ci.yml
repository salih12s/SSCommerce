name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sscommerce_ci
          POSTGRES_USER: sscommerce
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sscommerce -d sscommerce_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Yalnızca CI içindeki geçici konteyner için; gerçek sır değildir.
      SSCOMMERCE_TEST_POSTGRES: Host=localhost;Port=5432;Database=sscommerce_ci;Username=sscommerce;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/SSCommerce.slnx
      - name: Build
        run: dotnet build backend/SSCommerce.slnx -c Release --no-restore
      - name: Test
        run: dotnet test backend/SSCommerce.slnx -c Release --no-build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
